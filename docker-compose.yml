# ============================================================================
# Enterprise RAG Workbench - 本地一体化编排
# 用法 (Windows / Docker Desktop 的 PowerShell 或 Git Bash):
#   docker compose up -d            # 拉起全部服务
#   docker compose ps               # 查看健康状态
#   docker compose down             # 停止并移除容器(数据卷保留)
#   docker compose down -v          # 连同数据卷一并清除(谨慎)
#
# 说明:
#   - Milvus 采用 standalone 形态(单节点), 依赖 etcd(元数据) + MinIO(对象存储)
#   - PostgreSQL / Redis / MySQL / Neo4j 端口均做了宿主机映射, 便于本机直连调试
#   - 所有镜像固定版本, 避免 latest 漂移导致演示环境不一致
# ============================================================================

version: "3.8"

networks:
  rag-net:
    driver: bridge

volumes:
  milvus-etcd: {}
  milvus-minio: {}
  milvus-data: {}
  pg-data: {}
  redis-data: {}
  mysql-data: {}
  neo4j-data: {}

services:
  # ------------------------------------------------------------------ etcd
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: rag-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus-etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag-net

  # ------------------------------------------------------------------ MinIO
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: rag-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus-minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - rag-net

  # ------------------------------------------------------------------ Milvus
  milvus:
    image: milvusdb/milvus:v2.4.13
    container_name: rag-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"   # gRPC
      - "9091:9091"     # health
    depends_on:
      - etcd
      - minio
    networks:
      - rag-net

  # ------------------------------------------------------------------ PostgreSQL
  postgres:
    image: postgres:16.3-alpine
    container_name: rag-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag123456
      POSTGRES_DB: rag_workbench
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_workbench"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-net

  # ------------------------------------------------------------------ Redis
  redis:
    image: redis:7.2.5-alpine
    container_name: rag-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-net

  # ------------------------------------------------------------------ MySQL
  mysql:
    image: mysql:8.0.38
    container_name: rag-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysql123456
      MYSQL_DATABASE: rag_mysql
      MYSQL_USER: rag
      MYSQL_PASSWORD: rag123456
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4"]
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prag123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rag-net

  # ------------------------------------------------------------------ Neo4j (Phase 2 前加入, 默认注释, 需要图谱时可启用)
  neo4j:
    image: neo4j:5.20.0
    container_name: rag-neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j123456
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
    ports:
      - "7474:7474"   # HTTP 浏览器
      - "7687:7687"   # Bolt
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - rag-net
